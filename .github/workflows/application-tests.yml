name: Application tests

on:
  push:
  pull_request:

jobs:
  app-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build and run protocol and application acceptance tests
        run: make test
      - name: Check Python syntax
        run: python3 -m py_compile src/topology.py sdn/exam_controller.py scripts/*.py
      - name: Install pinned controller dependencies
        run: |
          python3 -m venv .venv-sdn
          .venv-sdn/bin/python -m pip install --upgrade pip
          .venv-sdn/bin/python -m pip install -r requirements-sdn.txt
      - name: Run controller control-interface test
        run: make test-controller
